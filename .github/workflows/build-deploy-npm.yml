name: Build & Deploy NPM
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  NBGV_GitEngine: LibGit2
  NpmDirectory: npm/dist/bpits/results-ngx

defaults:
  run:
    shell: pwsh

permissions:
  id-token: write # Required for `--provenance` flag on `npm publish`
    
jobs:
  create_npm:
    name: "Build"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.NpmPackageVersion }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: |
            npm
            version.json
          sparse-checkout-cone-mode: false

      - name: Determine package version (NerdBank Git Versioning)
        uses: dotnet/nbgv@v0.4
        id: nbgv

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.nbgv.outputs.NpmPackageVersion }}
        run: |
          if ($env:RELEASE_TAG -cne "v$env:PACKAGE_VERSION") {
            throw "Release tag must match the NBGV package version: v$env:PACKAGE_VERSION"
          }
      
      # This step is needed because we can't check out a subdirectory.
      # Therefore, all `npm/` files should be moved to the project root.
      - name: Move `npm` files to root
        run: |
          Write-Output "Directory listing BEFORE moving to npm/"
          Get-ChildItem -Force | Select-Object Mode, LastWriteTime, Length, Name | Format-Table -AutoSize
          Get-ChildItem -Path "npm" -Force | Move-Item -Destination "."
          Remove-Item -Recurse -Force -Path "npm"
          
          Write-Output "Directory listing AFTER moving to npm/"
          Get-ChildItem -Force | Select-Object Mode, LastWriteTime, Length, Name | Format-Table -AutoSize

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install NPM packages
        run: npm ci

      - name: Build @bpits/results-ngx
        run: npm run build

      - name: Store NPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm
          if-no-files-found: error
          retention-days: 1
          path: 'dist/bpits/results-ngx/**'

  deploy_npm:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release'
    name: Publish NPM
    runs-on: ubuntu-latest
    needs: [ create_npm ]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download NPM artifact
        uses: actions/download-artifact@v4
        with:
          name: npm
          path: ${{ env.NpmDirectory }}

      - name: Update package version
        working-directory: ${{ env.NpmDirectory }}
        env:
          PACKAGE_VERSION: ${{ needs.create_npm.outputs.version }}
        run: npm version "$env:PACKAGE_VERSION" --no-git-tag-version --allow-same-version
      
      # Publish all NPM packages.
      - name: Publish NPM package
        working-directory: ${{ env.NpmDirectory }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
